services:
  - type: web
    name: nexus-uk-outreach
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    healthCheckPath: /api/stats
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: STARTING_PRICE
        value: "£129"
      - key: YOUR_NAME
        value: "Shubham Dixit"

